# run: conda env create --file environment.yml
name: RNAseq
channels:
  - conda-forge
  - bioconda
dependencies:
- conda-forge::python<3.12  # For umap
- conda-forge::pip
- conda-forge::jupyter
- bioconda::bedtools
- conda-forge::parallel  # FELIX
- conda-forge::umap-learn
- bioconda::trust4   # Immune (repertoire)
#- bioconda::arcas-hla  # Immune (HLA) -> Incompatible (numpy)
- pip:
  - pandas<3.0
  - openpyxl
#  - scikit-learn  # Installed by 'umap-learn'
  - seaborn==0.12.2
#  - scipy  # Installed by 'umap-learn'
  - plotly  # FELIX
  - combat  # FELIX
  - fastcluster  # FELIX (for faster seaborn's ClusterMap())
  - pydeseq2==0.5.4
