# run: conda env create --file environment.yml
name: RNAseq
channels:
  - conda-forge
  - bioconda
dependencies:
- python<3.12  # For umap
- pip
- jupyter
- bedtools
- parallel  # FELIX
- umap-learn
- pip:
  - pandas<3.0
  - openpyxl
#  - scikit-learn  # Installed by 'umap-learn'
  - seaborn==0.12.2
#  - scipy  # Installed by 'umap-learn'
  - plotly  # FELIX
  - combat  # FELIX
  - fastcluster  # FELIX (for faster seaborn's ClusterMap())
  - pydeseq2==0.5.4
